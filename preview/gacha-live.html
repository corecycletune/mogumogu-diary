<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/><title>モグモグ｜ガチャ開発プレビュー（フレーム維持・画像パーツ）</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#603f2b;background:#f8eedb}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 30% 5%,#fff7e6,#f0dfc4 85%)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #367acb;outline-offset:3px}.shell{max-width:1150px;min-height:100dvh;margin:auto;padding:10px 10px 20px;display:flex;flex-direction:column;gap:10px}.wood{position:relative;border:6px solid #785039;border-radius:20px;background:repeating-linear-gradient(0deg,transparent 0 21px,#ffffff0d 22px 24px,transparent 25px 48px),linear-gradient(100deg,#8e6040,#c18c5d 17%,#ae784e 48%,#d5a26d 82%,#90603e);box-shadow:inset 0 0 0 2px #e5b77b,0 5px 10px #4e2e202b}.topbar{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:67px}.topbar strong{font-size:clamp(17px,4vw,24px);color:#fff6e5;text-shadow:0 2px 2px #6d3b26}.topbar button{background:#f7dfb4;border:2px solid #895d3c;border-radius:18px;padding:7px 12px;color:#75472b;font-weight:800}.coin{white-space:nowrap;background:#5c3826;color:#fff3d0;border-radius:20px;padding:7px 12px;font-weight:800;font-size:13px}.coin span{color:#ffd56e}.body-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.side{display:none;padding:17px 15px;min-width:0}.side h2{margin:0 0 12px;font-size:17px;color:#fff7de;text-shadow:0 1px 2px #5a3623}.side .note{padding:12px;border-radius:13px;background:#ffefd1d9;font-size:13px;line-height:1.7}.side .deco{font-size:clamp(28px,4vw,50px);text-align:center;margin:16px 0}.side .muted{color:#705642;font-size:12px}.center{min-width:0;display:flex;justify-content:center;align-items:stretch;padding:9px;border-radius:23px;border:5px solid #8d6143;background:linear-gradient(140deg,#f6e6bc,#f9e3aa 45%,#eecb8c);box-shadow:inset 0 0 0 3px #fff8df,0 3px 8px #72503538}.machine{width:min(100%,420px);display:flex;flex-direction:column;align-items:stretch;gap:8px}.titleplate{text-align:center;background:linear-gradient(#fff6d8,#e9b978);border:4px solid #a97647;border-radius:18px;padding:9px 4px;color:#8a4c31;font-size:clamp(17px,4.5vw,23px);font-weight:1000;text-shadow:1px 1px #fff;box-shadow:inset 0 2px #fff8dd}.window-wrap{position:relative;width:100%;aspect-ratio:432/608;max-height:57vh;min-height:220px;overflow:hidden;border:8px solid #a86c42;border-radius:17px;box-shadow:inset 0 0 0 3px #fff3ca,0 4px 8px #58392155;background:#e6d2b1}.window-wrap img{display:block;width:100%;height:100%;object-fit:fill;background:#d5b991}.window-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 80%,#0002);z-index:1}.video-ready{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2;color:white;text-shadow:0 2px 6px #2b1c16;font-weight:900}.video-ready span{padding:10px 15px;background:#523729b9;border:2px solid #fff4dd;border-radius:22px}.video-ready[hidden]{display:none}/* The storyboard has a non-clickable skip graphic baked into its later frames.A REAL HTML button covers that graphic, and is wired to skip playback. */.skip{position:absolute;right:2%;top:2%;z-index:4;background:#4d3328;color:white;border:2px solid #fff4d8;border-radius:15px;padding:8px 11px;font-size:13px;font-weight:900;box-shadow:0 3px 8px #0005}/* Cover the storyboard's fake 'draw' button with a real clickable control. */.controls{position:relative;z-index:3;margin-top:-36%;padding:10px 10px 12px;background:linear-gradient(100deg,#9b6644,#d5a36d 18%,#bf8857 80%,#9d6644);border:5px solid #825035;border-radius:15px;box-shadow:0 -4px 12px #5a352c55,inset 0 0 0 2px #e9bb7f}.choices{display:flex;gap:7px;margin-bottom:9px}.choices button{flex:1;min-width:0;padding:8px 3px;border:2px solid #b47b4c;border-radius:12px;background:#fff0d1;color:#80583a;font-weight:900;font-size:13px}.choices button.active{background:#f8b2a5;border-color:#a95c48}.choices button:disabled{opacity:.55;cursor:not-allowed}.draw{display:block;width:100%;min-height:48px;border:3px solid #b65b57;border-radius:24px;background:linear-gradient(#ffb7aa,#ec7782);color:#713c39;font-size:17px;font-weight:1000;box-shadow:inset 0 2px #ffe4d4,0 3px #965543}.draw:disabled{opacity:.8}.state{text-align:center;font-size:12px;margin:0;min-height:17px;color:#fff7e3;text-shadow:0 1px #78492e}.bottombar{padding:11px 16px;min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff7df;font-size:13px;font-weight:800;text-shadow:0 1px #6b402d}.preview-banner{font-size:12px;text-align:center;margin:0;color:#775a42;line-height:1.55}@media(min-width:800px) and (orientation:landscape){.shell{height:100dvh;max-height:1050px}.body-grid{grid-template-columns:minmax(130px,1fr) minmax(270px,460px) minmax(130px,1fr)}.side{display:block}.center{padding:7px}.machine{max-width:320px}.window-wrap{max-height:calc(100dvh - 370px);min-height:190px}.controls{margin-top:-36%}.titleplate{padding:7px}.topbar{min-height:62px}.bottombar{min-height:50px}}@media(max-width:380px){.shell{padding:6px 6px 14px;gap:7px}.center{padding:5px}.window-wrap{max-height:54vh}.titleplate{padding:6px}.topbar{min-height:55px;padding:8px}.topbar strong{font-size:16px}.coin{padding:5px 8px}.controls{padding:7px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}/* Existing approved wood frame, header, footer and button layout are intentionally unchanged. */.window-wrap .fallback-image{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}.stage{position:absolute;inset:0;z-index:1;overflow:hidden;background-image:url("data:image/webp;base64,UklGRohEAABXRUJQVlA4IHxEAABwZgGdASpoAfsBPt le('active',x===b))}));const choices=document.createElement('div');choices.className='rarity-choices';choices.innerHTML='<button type="button" data-r="normal" aria-pressed="true">通常 N・R</button><button type="button" data-r="chance" aria-pressed="false">チャンス SR・SSR</button><button type="button" data-r="hot" aria-pressed="false">激アツ UR</button>';choices.style.cssText='display:flex;gap:5px;margin:0 0 9px';choices.querySelectorAll('button').forEach(b=>{b.style.cssText='flex:1;min-width:0;font-size:11px;font-weight:800;border:2px solid #b47b4c;border-radius:10px;padding:8px 2px;background:#fff0d1;color:#80583a';b.addEventListener('click',()=>{if(busy)clear();rarity=b.dataset.r;stage.dataset.phase='idle';stage.dataset.rarity=rarity;choices.querySelectorAll('button').forEach(x=>{x.setAttribute('aria-pressed',String(x===b));x.style.background=x===b?'#f8b2a5':'#fff0d1'});status.textContent='演出を選びました。'});});choices.querySelector('button').style.background='#f8b2a5';document.querySelector('.controls').insertBefore(choices,document.querySelector('.choices'));stage.dataset.rarity=rarity;$('back').addEventListener('click',()=>{status.textContent='この画面は独立プレビューです。'});})();</script></body></html>
