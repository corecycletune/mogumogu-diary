name: Firestore rules

on:
  pull_request:
    branches: [main]
    paths: &rules_paths
      - firestore.rules
      - firebase.rules.json
      - .firebaserc
      - firebase.json
      - package.json
      - package-lock.json
      - tests/firestore-rules.emulator.mjs
      - progress-store.js
      - quest-core.js
      - .github/workflows/firestore-rules.yml
  push:
    branches: [main]
    paths: *rules_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:rules

  deploy:
    name: Deploy Firestore rules
    needs: validate
    if: github.repository == 'corecycletune/mogumogu-diary' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never interrupt an in-flight release. Skip queued runs that are stale.
    concurrency:
      group: firestore-rules-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Require one-time OIDC configuration
        env:
          PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" || { echo 'Set FIREBASE_WIF_PROVIDER in repository Actions variables'; exit 1; }
          test "$SERVICE_ACCOUNT" = 'firestore-rules-deploy@mogumogu-diary.iam.gserviceaccount.com' || { echo 'Set FIREBASE_DEPLOY_SERVICE_ACCOUNT to the dedicated deploy account'; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Check this commit is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api repos/corecycletune/mogumogu-diary/git/ref/heads/main --jq '.object.sha')
          if [ "$current_sha" = "$GITHUB_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; else echo 'Skipping stale commit'; fi
      - name: Deploy only the default database rules
        if: steps.current.outputs.deploy == 'true'
        run: npm run deploy:rules
