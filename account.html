<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ee"><title>ログイン | モグモグデイリークエスト</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./design.css"><link rel="icon" href="./icons/icon.svg"><link rel="apple-touch-icon" href="./icons/onigiri-180.png?v=onigiri-v2"></head>
<body class="welcome-page"><main class="shell account-shell"><img class="account-mascot" src="./icons/onigiri-192.png" width="88" height="88" alt="おにぎり"><h1>モグモグデイリークエスト</h1><div class="card"><h2 id="accountTitle">おかえりなさい</h2><form id="accountForm" method="post"><label class="label" for="accountId">ユーザーID</label><input id="accountId" class="field" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="半角英数字・_ 3〜24文字"><label class="label" for="accountPassword">パスワード</label><input id="accountPassword" class="field" type="password" required minlength="10" maxlength="128" autocomplete="current-password" placeholder="10文字以上"><label class="label" id="accountConfirmLabel" for="accountConfirm" hidden>パスワード（確認）</label><input id="accountConfirm" class="field" type="password" minlength="10" maxlength="128" autocomplete="new-password" hidden><p id="accountRecovery" class="small" hidden>メールを使わない登録です。IDとパスワードを控えてください。パスワードを忘れた場合の再設定には対応していません。</p><button id="accountSubmit" class="btn primary" type="submit" disabled>ログイン</button><p id="accountStatus" role="status">ログイン画面を準備しています…</p></form><button id="accountSwitch" class="btn secondary" type="button">はじめての方はこちら</button></div><a class="btn secondary" href="./pwa-guide.html">ホーム画面に追加する方法</a></main><script src="./account-entry.js" type="module"></script></body></html>
